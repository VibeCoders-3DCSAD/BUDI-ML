[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-ml"
version = "0.1.0"
description = "Python/FastAPI ML serving service and model development pipeline for the BUDI thesis."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]",
    "torch==2.13.0",
    "scikit-learn==1.9.0",
    "statsmodels>=0.15.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests", "training"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"training/scripts/**/*.py" = ["B008", "T201"]
"app/api/*.py" = ["B008"]
# Mirrored into budgie-ml-service, whose CI groups app and tests imports together.
"tests/test_classification.py" = ["I001"]
"tests/test_classification_rules.py" = ["I001"]
"tests/test_forecast.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [".venv", "build", "dist", "training/datasets", "training/synth", "training/models"]

[[tool.mypy.overrides]]
module = ["torch.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::UserWarning",
]
